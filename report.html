<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التقرير الشامل | صيف الابتكار 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  :root{--navy:#0B1B3F;--gold:#E7B10A;--cream:#FBF6E9;--ink:#1c2230;--line:#e7ddc0;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'IBM Plex Sans Arabic',sans-serif;}
  h1,h2,h3{font-weight:800;}

  .loginCard{max-width:380px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;}
  .loginCard input{width:100%;padding:12px;border:1.5px solid #dcd3b8;border-radius:10px;font-size:15px;font-family:inherit;margin-bottom:10px;}
  .loginCard button{width:100%;background:var(--gold);color:var(--navy);border:none;border-radius:10px;
    padding:12px;font-weight:700;font-size:15px;cursor:pointer;}
  .hide{display:none !important;}

  .topbar{background:var(--navy);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;}
  .topbar h1{font-size:18px;margin:0;}
  .topbar .actions{display:flex;gap:8px;}
  .topbar button{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:8px;
    padding:7px 14px;cursor:pointer;font-family:inherit;font-size:13.5px;}
  .topbar button.primary{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700;}

  main{max-width:1000px;margin:0 auto;padding:24px 20px 60px;}

  .report-header{text-align:center;margin-bottom:28px;}
  .report-header h2{font-size:24px;color:var(--navy);margin:0 0 4px;}
  .report-header .sub{color:#6b7280;font-size:13.5px;}

  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;}
  .stat .num{font-size:28px;font-weight:800;color:var(--navy);}
  .stat .lbl{font-size:12.5px;color:#6b7280;margin-top:4px;}

  .section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:20px;}
  .section h3{margin:0 0 14px;color:var(--navy);font-size:16px;border-right:4px solid var(--gold);padding-right:10px;}

  table{width:100%;border-collapse:collapse;}
  th, td{padding:9px 10px;text-align:right;font-size:13.5px;border-bottom:1px solid #f0ead4;}
  th{background:var(--navy);color:#fff;font-weight:600;}

  .photo-upload-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
  .photo-upload-row select{padding:10px;border:1.5px solid #dcd3b8;border-radius:10px;font-family:inherit;}
  .photo-upload-row input[type=file]{flex:1;min-width:200px;}
  .photo-upload-row button{background:var(--gold);color:var(--navy);border:none;border-radius:10px;
    padding:10px 16px;font-weight:700;cursor:pointer;}

  .photos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;}
  .photo-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;}
  .photo-card img{width:100%;height:140px;object-fit:cover;display:block;}
  .photo-card .cap{font-size:11.5px;color:#6b7280;padding:6px 8px;}
  .photo-card .del{position:absolute;top:6px;left:6px;background:rgba(192,57,43,.9);color:#fff;border:none;
    border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:13px;}
  .photo-qr-wrap{text-align:center;margin-top:10px;}
  .photo-qr-wrap canvas{border:1px solid var(--line);border-radius:8px;}

  .msg{font-size:13px;margin-top:8px;padding:8px 10px;border-radius:8px;display:none;}
  .msg.error{background:#fdecec;color:#9c2b2b;display:block;}
  .msg.success{background:#e8f6ec;color:#1e7a3f;display:block;}

  @media print {
    .topbar, .no-print{display:none !important;}
    body{background:#fff;}
    .section{break-inside:avoid;border:1px solid #ddd;box-shadow:none;}
  }
</style>
</head>
<body>

<div class="loginCard" id="loginCard">
  <h2 style="margin-top:0;">دخول فريق الإدارة</h2>
  <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" dir="ltr" style="text-align:right;">
  <input type="password" id="loginPass" placeholder="كلمة المرور">
  <button onclick="login()">دخول</button>
  <div id="loginErr" style="color:#9c2b2b;font-size:13px;margin-top:8px;"></div>
</div>

<div id="app" class="hide">
  <div class="topbar no-print">
    <h1>التقرير الشامل — صيف الابتكار 2026</h1>
    <div class="actions">
      <button onclick="window.print()" class="primary">تصدير / طباعة PDF</button>
      <a href="admin.html" style="text-decoration:none;"><button>رجوع للوحة التحكم</button></a>
    </div>
  </div>

  <main>
    <div class="report-header">
      <h2>التقرير الشامل لبرنامج صيف الابتكار 2026</h2>
      <div class="sub" id="reportDate"></div>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="section">
      <h3>الأداء حسب المسار</h3>
      <div style="overflow-x:auto;">
        <table id="trackTable">
          <thead><tr><th>المسار</th><th>المسجلون</th><th>حضور كامل</th><th>شهادات صادرة</th><th>متوسط التقييم</th></tr></thead>
          <tbody id="trackTbody"></tbody>
        </table>
      </div>
    </div>

    <div class="section">
      <h3>معرض الصور</h3>
      <div class="photo-upload-row no-print">
        <select id="photoTrack"><option value="">صورة عامة (كل البرنامج)</option></select>
        <input type="file" id="photoFile" accept="image/*" multiple>
        <input type="text" id="photoCaption" placeholder="وصف مختصر (اختياري)" style="padding:10px;border:1.5px solid #dcd3b8;border-radius:10px;font-family:inherit;">
        <button onclick="uploadPhotos()">رفع الصور</button>
      </div>
      <div class="msg" id="photoMsg"></div>
      <div class="photos-grid" id="photosGrid"></div>
    </div>

    <div class="section no-print">
      <h3>رمز QR لمشاركة هذا التقرير</h3>
      <div class="photo-qr-wrap">
        <canvas id="reportQr"></canvas>
        <p style="font-size:12.5px;color:#6b7280;">امسح الرمز لفتح هذا التقرير مباشرة على جهاز آخر</p>
      </div>
    </div>
  </main>
</div>

<script src="config.js"></script>
<script>
supabaseClient.auth.onAuthStateChange(async (event, session) => {
  if(session){
    const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
    if(!profile || profile.role !== 'admin'){
      alert('هذا التقرير مخصص للمسؤولين فقط.');
      await supabaseClient.auth.signOut();
      return;
    }
    document.getElementById('loginCard').classList.add('hide');
    document.getElementById('app').classList.remove('hide');
    loadReport();
  }
});

async function login(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error) document.getElementById('loginErr').textContent = 'بيانات الدخول غير صحيحة';
}

let tracksData = [];

async function loadReport(){
  document.getElementById('reportDate').textContent = 'تاريخ الإصدار: ' + new Date().toLocaleDateString('ar-SA', {dateStyle:'long'});

  const { data: t } = await supabaseClient.from('tracks').select('*').order('day1_date');
  tracksData = t || [];
  document.getElementById('photoTrack').innerHTML += tracksData.map(tr => `<option value="${tr.id}">${tr.name_ar}</option>`).join('');

  const { data: reportData } = await supabaseClient.rpc('get_full_report');
  const r = (reportData && reportData[0]) || {};
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat"><div class="num">${r.total_participants ?? 0}</div><div class="lbl">إجمالي المشاركين</div></div>
    <div class="stat"><div class="num">${r.total_hours ?? 0}</div><div class="lbl">ساعة تدريبية مُنجزة</div></div>
    <div class="stat"><div class="num">${r.certificates_issued ?? 0}</div><div class="lbl">شهادة صادرة</div></div>
    <div class="stat"><div class="num">${r.avg_satisfaction ?? '—'}</div><div class="lbl">متوسط الرضا (5)</div></div>
    <div class="stat"><div class="num">${r.organizations_count ?? 0}</div><div class="lbl">جهة مشاركة</div></div>
    <div class="stat"><div class="num">${r.evaluations_count ?? 0}</div><div class="lbl">استبيان مكتمل</div></div>
  `;

  const { data: trackReport } = await supabaseClient.rpc('get_track_report');
  document.getElementById('trackTbody').innerHTML = (trackReport || []).map(t => `
    <tr>
      <td>${t.track_name}</td>
      <td>${t.participant_count}</td>
      <td>${t.full_attendance_count}</td>
      <td>${t.certified_count}</td>
      <td>${t.avg_rating ?? '—'}</td>
    </tr>
  `).join('');

  await loadPhotos();

  QRCode.toCanvas(document.getElementById('reportQr'), window.location.href, { width: 160, margin: 1,
    color:{ dark:'#0B1B3F', light:'#ffffff' } });
}

async function loadPhotos(){
  const { data } = await supabaseClient.from('program_photos').select('*, tracks(name_ar)').order('uploaded_at', {ascending:false});
  const photos = data || [];
  document.getElementById('photosGrid').innerHTML = photos.map(p => `
    <div class="photo-card">
      <button class="del no-print" onclick="deletePhoto('${p.id}')">✕</button>
      <img src="${p.url}" loading="lazy">
      <div class="cap">${p.caption || (p.tracks ? p.tracks.name_ar : 'عام')}</div>
    </div>
  `).join('') || '<p style="color:#9ca3af;font-size:13px;">لا توجد صور مرفوعة بعد</p>';
}

async function uploadPhotos(){
  const files = document.getElementById('photoFile').files;
  const trackId = document.getElementById('photoTrack').value || null;
  const caption = document.getElementById('photoCaption').value.trim() || null;
  const msg = document.getElementById('photoMsg');

  if(!files.length){ msg.className = 'msg error'; msg.textContent = 'اختر صورة واحدة على الأقل'; return; }

  msg.className = 'msg'; msg.style.display = 'none';
  let success = 0, failed = 0;

  for(const file of files){
    const path = `${Date.now()}-${Math.random().toString(36).slice(2)}-${file.name}`;
    const { error: uploadErr } = await supabaseClient.storage.from('program-photos').upload(path, file);
    if(uploadErr){ failed++; continue; }

    const { data: urlData } = supabaseClient.storage.from('program-photos').getPublicUrl(path);
    const { error: insertErr } = await supabaseClient.from('program_photos').insert({
      track_id: trackId, url: urlData.publicUrl, caption
    });
    insertErr ? failed++ : success++;
  }

  msg.className = failed ? 'msg error' : 'msg success';
  msg.textContent = `تم رفع ${success} صورة${failed ? ' — فشل رفع ' + failed : ''}`;
  document.getElementById('photoFile').value = '';
  document.getElementById('photoCaption').value = '';
  loadPhotos();
}

async function deletePhoto(id){
  if(!confirm('حذف هذه الصورة؟')) return;
  await supabaseClient.from('program_photos').delete().eq('id', id);
  loadPhotos();
}
</script>
</body>
</html>
